<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Spinner</title>
<style>
  :root {
    --bg: #101015;
    --panel: #19191f;
    --panel2: #202027;
    --panel3: #292932;
    --line: #393943;
    --text: #f6f5f8;
    --muted: #a5a4b0;
    --red: #f04b4f;
    --red-dark: #bf2e37;
    --gold: #ffd447;
    --blue: #54c7ff;
    --green: #6fe1ad;
    --radius: 15px;
    --shadow: 0 16px 50px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; }
  html { min-width: 320px; background: var(--bg); }
  body {
    margin: 0; color: var(--text); background:
      radial-gradient(ellipse at 52% -12%, rgba(240,75,79,.16), transparent 48%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px), var(--bg);
    background-size: auto, 28px 28px, 28px 28px, auto;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .42; }
  .app-shell { max-width: 1720px; margin: 0 auto; padding: 22px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:13px; min-width:0; }
  .brand-mark { width:48px; height:48px; display:grid; place-items:center; flex:none; background:var(--red); color:#fff; clip-path:polygon(0 0,100% 0,87% 100%,13% 100%); font-size:24px; font-weight:1000; text-shadow:2px 2px 0 #7c1720; }
  .brand-kicker { color:var(--gold); font-size:10px; font-weight:900; letter-spacing:.23em; text-transform:uppercase; margin-bottom:3px; }
  h1 { margin:0; font-size:clamp(22px,2.7vw,32px); line-height:1; letter-spacing:-.055em; font-weight:1000; font-style:italic; text-transform:uppercase; }
  .brand-sub { color:var(--muted); font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin-top:6px; }
  .top-actions { display:flex; justify-content:flex-end; align-items:center; gap:9px; flex-wrap:wrap; }
  .club-select-wrap { display:flex; align-items:center; gap:8px; padding:7px 9px 7px 12px; border:1px solid var(--line); background:rgba(25,25,31,.9); border-radius:10px; }
  .club-select-wrap label { font-size:10px; color:var(--muted); font-weight:900; letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
  select, input[type="text"], textarea { color:var(--text); background:#111116; border:1px solid var(--line); border-radius:9px; outline:none; }
  select { padding:8px 28px 8px 10px; max-width:200px; }
  input[type="text"] { width:100%; padding:11px 12px; }
  textarea { width:100%; min-height:122px; padding:12px; resize:vertical; }
  select:focus, input:focus, textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(84,199,255,.13); }
  .btn { border:1px solid transparent; border-radius:9px; padding:10px 13px; font-weight:850; color:var(--text); background:var(--panel3); transition:filter .15s ease, transform .15s ease, background .15s ease; }
  .btn:hover:not(:disabled) { filter:brightness(1.12); transform:translateY(-1px); }
  .btn-primary { background:var(--red); border-color:#ff6a6e; color:white; box-shadow:0 4px 0 var(--red-dark); }
  .btn-ghost { background:rgba(32,32,39,.85); border-color:var(--line); }
  .btn-danger { background:#402126; border-color:#7d333b; color:#ffbec1; }
  .btn-small { padding:7px 9px; font-size:12px; }
  .icon-btn { width:34px; height:34px; display:inline-grid; place-items:center; border-radius:8px; border:1px solid var(--line); background:#25252c; color:#f5f4f8; font-weight:900; }
  .icon-btn:hover:not(:disabled) { border-color:var(--blue); }
  .layout { display:grid; grid-template-columns:minmax(260px,320px) minmax(360px,1fr) minmax(260px,320px); gap:16px; align-items:stretch; }
  .panel { background:linear-gradient(155deg,rgba(32,32,40,.97),rgba(23,23,29,.97)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0; overflow:hidden; }
  .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:17px 17px 13px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.018); }
  .panel-title { display:flex; align-items:center; gap:9px; margin:0; font-weight:1000; font-size:15px; letter-spacing:.015em; text-transform:uppercase; }
  .panel-number { display:grid; place-items:center; width:26px; height:26px; background:var(--gold); color:#1c1b17; font-size:12px; font-weight:1000; clip-path:polygon(16% 0,100% 0,84% 100%,0 100%); }
  .panel-sub { color:var(--muted); font-size:11px; margin-top:4px; }
  .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); color:var(--muted); background:#17171d; border-radius:99px; padding:5px 8px; font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; }
  .pill-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
  .people-panel, .history-panel { min-height:650px; display:flex; flex-direction:column; }
  .people-tools { padding:13px 14px; border-bottom:1px solid var(--line); }
  .add-form { display:flex; gap:7px; }
  .add-form input { min-width:0; }
  .add-form .btn { flex:none; }
  .tool-row { display:flex; gap:7px; margin-top:9px; }
  .tool-row .btn { flex:1; }
  .helper { color:var(--muted); font-size:11px; line-height:1.45; margin:9px 1px 0; }
  .error-note { margin-top:9px; padding:9px 10px; border:1px solid #9a4247; background:#3a2024; border-radius:8px; color:#ffd0d2; font-size:12px; line-height:1.4; }
  .people-list { padding:7px; overflow:auto; max-height:calc(100vh - 345px); min-height:205px; }
  .person-row { display:flex; align-items:center; gap:8px; padding:8px 7px; border:1px solid transparent; border-bottom-color:rgba(255,255,255,.055); border-radius:9px; min-width:0; }
  .person-row:hover { background:rgba(255,255,255,.035); border-color:rgba(255,255,255,.06); }
  .person-row.out { opacity:.46; filter:saturate(.5); background:rgba(0,0,0,.1); }
  .person-avatar { width:36px; height:36px; flex:none; border-radius:9px; display:grid; place-items:center; overflow:hidden; background:#111116; border:1px solid #41414b; }
  .person-avatar img { max-width:100%; max-height:100%; object-fit:contain; }
  .person-avatar .blank-avatar { width:100%; height:100%; display:grid; place-items:center; color:#63636e; font-size:20px; }
  .person-meta { flex:1; min-width:0; }
  .person-name { color:#f4f3f6; font-size:13px; font-weight:800; overflow-wrap:anywhere; }
  .person-status { margin-top:3px; font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.11em; font-weight:850; }
  .person-actions { display:flex; gap:4px; flex:none; }
  .person-actions .icon-btn { width:29px; height:29px; font-size:13px; }
  .empty-list { display:flex; min-height:180px; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:24px; color:var(--muted); }
  .empty-list strong { color:var(--text); margin-bottom:6px; }
  .panel-foot { padding:11px 14px; border-top:1px solid var(--line); margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:10px; letter-spacing:.07em; text-transform:uppercase; }
  .wheel-panel { min-height:650px; display:flex; flex-direction:column; position:relative; }
  .wheel-topline { display:flex; align-items:center; justify-content:space-between; padding:17px 20px 0; gap:12px; }
  .wheel-eyebrow { color:var(--gold); font-size:10px; font-weight:950; letter-spacing:.19em; text-transform:uppercase; }
  .wheel-status { font-size:11px; color:var(--muted); text-align:right; }
  .wheel-stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:400px; padding:5px 18px 0; }
  .wheel-wrap { width:min(100%,620px); aspect-ratio:1; max-height:calc(100vh - 310px); position:relative; display:grid; place-items:center; }
  #wheelCanvas { display:block; width:100%; height:100%; filter:drop-shadow(0 13px 15px rgba(0,0,0,.45)); transform:rotate(0deg); transform-origin:50% 50%; }
  .wheel-pointer { position:absolute; z-index:2; top:-3px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:19px solid transparent; border-right:19px solid transparent; border-top:0; border-bottom:43px solid var(--gold); filter:drop-shadow(0 3px 0 #9d7610) drop-shadow(0 4px 4px #000); }
  .wheel-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; width:clamp(52px,10%,78px); aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:linear-gradient(145deg,#f9f8fc,#c9c7d0); border:5px solid #fff; box-shadow:0 0 0 5px #2c2c34,0 8px 18px #0008; color:#22212a; font-weight:1000; font-size:clamp(12px,1.8vw,18px); font-style:italic; }
  .wheel-center span { transform:rotate(-12deg); }
  .wheel-caption { color:var(--muted); text-align:center; font-size:11px; margin:0 0 15px; }
  .spin-controls { padding:0 20px 20px; }
  .spin-label { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; color:var(--muted); font-size:10px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
  .spin-buttons { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .spin-btn { min-width:0; padding:13px 5px 11px; background:linear-gradient(180deg,#e94b51,#c72d39); border:1px solid #ff777d; border-bottom:4px solid #8d1f2a; border-radius:10px; color:white; font-weight:1000; text-transform:uppercase; box-shadow:0 7px 15px rgba(205,40,52,.14); }
  .spin-btn:hover:not(:disabled) { filter:brightness(1.13); transform:translateY(-2px); }
  .spin-btn .spin-count { display:block; font-size:24px; line-height:1.05; font-style:italic; }
  .spin-btn .spin-text { display:block; margin-top:5px; font-size:9px; letter-spacing:.1em; }
  .spin-btn.recommended { outline:2px solid var(--gold); outline-offset:2px; }
  .centre-note { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; width:45%; color:#777681; text-transform:uppercase; font-size:11px; font-weight:900; letter-spacing:.13em; }
  .history-toolbar { display:flex; align-items:center; gap:6px; }
  .history-list { padding:10px; overflow:auto; max-height:calc(100vh - 250px); flex:1; }
  .history-empty { height:100%; min-height:240px; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; color:var(--muted); padding:24px; }
  .history-empty .empty-glyph { font-size:42px; color:#4c4c57; margin-bottom:10px; font-weight:1000; }
  .history-empty strong { color:var(--text); margin-bottom:6px; }
  .history-group { border:1px solid #3a3a45; background:rgba(8,8,12,.3); border-radius:11px; margin-bottom:10px; overflow:hidden; }
  .history-group-head { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 11px; background:rgba(255,255,255,.035); border-bottom:1px solid #35353e; }
  .draw-title { font-size:11px; font-weight:1000; letter-spacing:.11em; text-transform:uppercase; }
  .draw-meta { color:var(--muted); font-size:9px; margin-top:3px; }
  .draw-count { font-size:10px; color:var(--gold); font-weight:900; }
  .picked-row { display:flex; align-items:center; gap:9px; padding:9px 11px; border-bottom:1px solid rgba(255,255,255,.045); }
  .picked-row:last-child { border-bottom:0; }
  .picked-order { width:21px; height:21px; flex:none; display:grid; place-items:center; background:#34343d; color:#d9d8df; border-radius:6px; font-size:10px; font-weight:1000; }
  .picked-avatar { width:30px; height:30px; border:1px solid #45454f; border-radius:7px; background:#111116; display:grid; place-items:center; flex:none; overflow:hidden; }
  .picked-avatar img { max-width:100%; max-height:100%; object-fit:contain; }
  .picked-name { font-size:12px; font-weight:850; overflow-wrap:anywhere; }
  .picked-time { margin-left:auto; flex:none; font-size:9px; color:var(--muted); }
  .footer-note { color:#6d6c78; font-size:10px; text-align:center; padding:15px 4px 0; }
  .modal-backdrop { position:fixed; z-index:50; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(3,3,8,.78); backdrop-filter:blur(9px); }
  .modal { width:min(100%,520px); max-height:min(88vh,860px); display:flex; flex-direction:column; border:1px solid #4b4b56; border-radius:16px; overflow:hidden; background:#1a1a21; box-shadow:0 30px 100px #000b; }
  .modal.modal-wide { width:min(100%,850px); }
  .modal-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 20px 15px; border-bottom:1px solid var(--line); background:linear-gradient(110deg,rgba(240,75,79,.1),transparent); }
  .modal-kicker { color:var(--gold); font-size:9px; font-weight:950; letter-spacing:.2em; text-transform:uppercase; margin-bottom:4px; }
  .modal h2 { margin:0; font-size:19px; letter-spacing:-.02em; }
  .modal-body { padding:18px 20px; overflow:auto; }
  .modal-actions { display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding:14px 20px; border-top:1px solid var(--line); background:rgba(0,0,0,.12); }
  .field-label { display:block; color:#d7d6de; font-size:11px; font-weight:900; letter-spacing:.09em; text-transform:uppercase; margin-bottom:7px; }
  .field-help { color:var(--muted); font-size:11px; line-height:1.5; margin-top:7px; }
  .field-block { margin-bottom:17px; }
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .setting-row:last-child { border-bottom:0; }
  .setting-title { font-size:13px; font-weight:850; }
  .setting-desc { color:var(--muted); font-size:11px; line-height:1.45; margin-top:4px; max-width:330px; }
  .setting-row input[type="checkbox"] { width:19px; height:19px; accent-color:var(--red); flex:none; }
  .setting-row select { min-width:135px; }
  .settings-section-title { margin:18px 0 4px; color:var(--gold); font-size:10px; letter-spacing:.17em; text-transform:uppercase; font-weight:950; }
  .current-roster-box { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px; border:1px solid var(--line); background:#14141a; border-radius:10px; }
  .current-roster-box strong { font-size:13px; }
  .current-roster-box small { display:block; color:var(--muted); margin-top:4px; font-size:10px; }
  .fighter-search { display:flex; gap:9px; margin-bottom:13px; }
  .fighter-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .fighter-card { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; padding:10px 5px 8px; min-height:105px; border-radius:10px; border:1px solid #393943; background:#222229; color:var(--text); }
  .fighter-card:hover { border-color:var(--gold); background:#2b2a30; }
  .fighter-card img { width:45px; height:45px; object-fit:contain; }
  .fighter-card .fighter-fallback { width:45px; height:45px; display:none; place-items:center; background:#15151a; border:1px dashed #4a4a55; border-radius:9px; color:var(--muted); font-size:12px; font-weight:950; }
  .fighter-card span:last-child { font-size:10px; text-align:center; line-height:1.2; font-weight:800; }
  .selected-fighter { display:flex; align-items:center; gap:12px; padding:11px; background:#121218; border:1px solid var(--line); border-radius:10px; margin-bottom:15px; }
  .selected-fighter img { width:56px; height:56px; object-fit:contain; }
  .variant-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
  .variant-card { border:1px solid var(--line); background:#25252d; color:var(--text); padding:11px; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:7px; font-size:11px; font-weight:850; }
  .variant-card:hover { border-color:var(--gold); }
  .variant-card img { width:53px; height:53px; object-fit:contain; }
  .confirm-copy { color:#d0cfd8; font-size:13px; line-height:1.6; }
  .toast { position:fixed; z-index:80; bottom:22px; left:50%; transform:translateX(-50%); padding:12px 16px; border-radius:10px; border:1px solid #4f4f59; background:#292930; color:#fff; box-shadow:0 9px 35px #0008; font-size:12px; font-weight:800; max-width:calc(100vw - 32px); text-align:center; }
  .toast.warn { border-color:#b64c53; background:#472328; }
  .hide { display:none !important; }
  @media (max-width:1150px) {
    .app-shell { padding:15px; }
    .layout { grid-template-columns:minmax(250px,.8fr) minmax(370px,1.3fr); }
    .history-panel { grid-column:1/-1; min-height:330px; }
    .history-list { max-height:420px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:start; gap:10px; }
    .history-group { margin-bottom:0; }
    .wheel-wrap { max-height:620px; }
  }
  @media (max-width:730px) {
    .app-shell { padding:10px; }
    .topbar { align-items:flex-start; flex-direction:column; margin-bottom:13px; }
    .top-actions { width:100%; justify-content:stretch; }
    .club-select-wrap { flex:1; min-width:0; }
    .club-select-wrap select { flex:1; min-width:0; max-width:none; }
    .top-actions > .btn { flex:none; }
    .layout { display:flex; flex-direction:column; gap:12px; }
    .people-panel, .wheel-panel, .history-panel { min-height:initial; }
    .people-list { max-height:390px; min-height:100px; }
    .wheel-stage { min-height:0; padding:14px 12px 4px; }
    .wheel-wrap { width:min(100%,520px); max-height:none; }
    .wheel-pointer { border-left-width:14px; border-right-width:14px; border-bottom-width:31px; }
    .spin-controls { padding:0 13px 16px; }
    .wheel-caption { padding:0 12px; }
    .history-panel { min-height:310px; }
    .history-list { max-height:480px; display:block; }
    .history-group { margin-bottom:10px; }
    .fighter-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .variant-grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .modal-backdrop { padding:10px; }
    .modal-body { padding:15px; }
    .modal-head { padding:15px; }
    .modal-actions { padding:12px 15px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; } }

  /* Monochrome Smash menu styling: only the wheel uses the five fighter-select colours. */
  :root {
    --bg:#000000; --panel:#000000; --panel2:#000000; --panel3:#ebebeb; --line:#ebebeb;
    --text:#ebebeb; --muted:#ebebeb; --red:#ebebeb; --red-dark:#ebebeb; --gold:#ebebeb;
    --blue:#ebebeb; --green:#ebebeb; --shadow:none; --radius:3px;
  }
  html, body { background:#000000 !important; color:#ebebeb; }
  body { background:#000000 !important; }
  .app-shell { background:#000000; }
  .panel, .people-panel, .wheel-panel, .history-panel { background:#000000 !important; border:1px solid #ebebeb !important; border-radius:3px !important; box-shadow:none !important; }
  .panel-head { background:#ebebeb !important; color:#000000 !important; border-bottom:1px solid #ebebeb !important; }
  .panel-head .panel-title, .panel-head .panel-sub { color:#000000 !important; }
  .panel-head .panel-sub { opacity:.75; }
  .panel-number { background:#000000 !important; color:#ebebeb !important; clip-path:none !important; border:1px solid #000000; }
  .brand-mark { background:#ebebeb !important; color:#000000 !important; text-shadow:none !important; clip-path:none !important; }
  .brand-kicker, .brand-sub, .wheel-eyebrow, .wheel-status, .wheel-caption, .footer-note, .helper, .panel-foot { color:#ebebeb !important; }
  h1 { color:#ebebeb; }
  .club-select-wrap, .current-roster-box, .people-tools, .history-list, .history-group, .history-group-head,
  .selected-results, .setting-row, .modal, .modal-body, .modal-actions, .fighter-card, .selected-fighter,
  .variant-card, .history-empty, .empty-list { background:#000000 !important; color:#ebebeb !important; }
  .club-select-wrap, .current-roster-box, .history-group, .fighter-card, .selected-fighter, .variant-card,
  .selected-results, .result-pick, .error-note { border-color:#ebebeb !important; border-radius:3px !important; }
  select, input[type="text"], textarea { background:#000000 !important; color:#ebebeb !important; border:1px solid #ebebeb !important; border-radius:3px !important; }
  select:focus, input:focus, textarea:focus { border-color:#ebebeb !important; box-shadow:0 0 0 2px rgba(235,235,235,.22) !important; }
  .btn, .btn-primary, .btn-ghost, .btn-danger { background:#ebebeb !important; color:#000000 !important; border:1px solid #ebebeb !important; border-radius:3px !important; box-shadow:none !important; }
  .btn:hover:not(:disabled), .spin-btn:hover:not(:disabled) { background:#000000 !important; color:#ebebeb !important; border-color:#ebebeb !important; }
  .icon-btn { background:#000000 !important; color:#ebebeb !important; border:1px solid #ebebeb !important; border-radius:3px !important; }
  .icon-btn:hover:not(:disabled) { border-color:#ebebeb !important; background:#ebebeb !important; color:#000000 !important; }
  .pill { background:#000000 !important; color:#ebebeb !important; border:1px solid #ebebeb !important; border-radius:3px !important; }

<script>
(() => {
  const mural = document.getElementById('muralBackgroundImage');
  if (!mural) return;

  function fitAndStartMural() {
    if (!mural.naturalWidth || !mural.naturalHeight) return;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const aspectRatio = mural.naturalWidth / mural.naturalHeight;
    // A slight overscale fills the screen and leaves room for the pan even on wide displays.
    const height = Math.max(viewportHeight, viewportWidth / aspectRatio) * 1.06;
    const width = height * aspectRatio;
    mural.style.height = `${height}px`;
    mural.style.width = `${width}px`;
    mural.style.setProperty('--mural-end-x', `${Math.min(0, viewportWidth - width)}px`);
    // Restart at the far-left edge when the image loads or the viewport changes.
    mural.style.animation = 'none';
    void mural.offsetWidth;
    mural.style.animation = 'mural-pan 720s linear infinite alternate';
  }

  mural.addEventListener('load', fitAndStartMural);
  mural.addEventListener('error', () => { mural.style.display = 'none'; });
  window.addEventListener('resize', fitAndStartMural, {passive:true});
  if (mural.complete && mural.naturalWidth) fitAndStartMural();
})();
</script>

  function drawWheel() {
    if (data.settings.displayMode === 'grid') {
      drawGridHighlights();

    }
    const canvas=document.getElementById('wheelCanvas');
    if (!canvas) return;
    const ctx=canvas.getContext('2d');
    const size=720, cx=size/2, cy=size/2, radius=329;
    if (canvas.width!==size) canvas.width=size;
    if (canvas.height!==size) canvas.height=size;
    ctx.clearRect(0,0,size,size);

    const entries=retainedWheelEntries || visibleEntries();
    if (!entries.length) {
      ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2);
      ctx.strokeStyle='#000000'; ctx.lineWidth=16; ctx.stroke();
      return;
    }

    const step=Math.PI*2/entries.length;
    const base=-Math.PI/2;
    const segments=entries.map((entry,i)=>{
      const start=base+i*step, end=start+step, mid=start+step/2;
      const palette=WHEEL_COLOURS[i%WHEEL_COLOURS.length];

    });

    // Paint all slices and their dark dividers first. Highlights are deliberately
    // painted in a separate pass so neighbouring dividers cannot cover them.
    for (const {start,end,palette} of segments) {
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,start,end); ctx.closePath();
      const gradient=ctx.createRadialGradient(cx,cy,Math.max(1,radius*.035),cx,cy,radius);
      gradient.addColorStop(0,palette.light);
      gradient.addColorStop(1,palette.dark);
      ctx.fillStyle=gradient; ctx.fill();
      ctx.strokeStyle='#000000'; ctx.lineWidth=3; ctx.stroke();
    }

    // Lighten the whole selected slice, including its existing divider edges.
    for (const {entry,start,end} of segments) {
      if (!activeHighlightIds.has(entry.id)) continue;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,radius,start,end); ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,.34)'; ctx.fill();
    }

    // Fighter icons and full names sit above the slice fills. Name placement and
    // orientation are configurable, and the font scales to the space available.
    const radialNames = data.settings.nameLayout === 'radial';
    const keepUpright = data.settings.nameOrientation !== 'clockwise';
    for (const {entry,mid} of segments) {
      const iconRadius = radialNames ? radius*.30 : radius*.49;
      const iconX=cx+Math.cos(mid)*iconRadius, iconY=cy+Math.sin(mid)*iconRadius;
      const iconSize=Math.max(15,Math.min(radialNames ? 35 : 47,650/entries.length));
      if (entry.fighter) {
        const rec=cachedImage(entry.fighter,entry.color,true);
        if (rec?.loaded) ctx.drawImage(rec.img,iconX-iconSize/2,iconY-iconSize/2,iconSize,iconSize);
      }

      const labelRadius=radialNames ? radius*.68 : radius*.79;
      const lx=cx+Math.cos(mid)*labelRadius, ly=cy+Math.sin(mid)*labelRadius;
      let textRotation = radialNames ? mid : mid+Math.PI/2;
      // Normalize the baseline angle only when the readable/upright option is on.
      if (keepUpright) {
        textRotation=((textRotation+Math.PI*3)%(Math.PI*2))-Math.PI;
        if (textRotation>Math.PI/2) textRotation-=Math.PI;
        else if (textRotation< -Math.PI/2) textRotation+=Math.PI;
      }
      const label=entry.name;
      const maxTextWidth = radialNames
        ? radius*.58
        : Math.max(24, 2*labelRadius*Math.sin(Math.PI/entries.length)*.84);
      ctx.save(); ctx.translate(lx,ly); ctx.rotate(textRotation); ctx.textAlign='center'; ctx.textBaseline='middle';
      let fontSize=Math.min(19, 350/Math.pow(entries.length,.52));
      ctx.font=`900 ${fontSize}px system-ui, sans-serif`;
      while (fontSize>7.5 && ctx.measureText(label).width>maxTextWidth) {
        fontSize=Math.max(7.5,fontSize-.5);
        ctx.font=`900 ${fontSize}px system-ui, sans-serif`;
      }
      ctx.lineJoin='round'; ctx.strokeStyle='#000000'; ctx.lineWidth=Math.max(1.1,fontSize*.105);
      // maxWidth is a final safety net for unusually long names; unlike the old
      // behaviour, the name is never truncated or replaced with an ellipsis.
      ctx.strokeText(label,0,0,maxTextWidth);
      ctx.fillStyle='#ffffff'; ctx.fillText(label,0,0,maxTextWidth); ctx.restore();
    }

    // selection stroke last so it shows on both sides of every divider and over
    // the outer rim instead of being hidden underneath either one.
    ctx.beginPath(); ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.strokeStyle='#000000'; ctx.lineWidth=16; ctx.stroke();
    for (const {entry,start,end} of segments) {

  function addBulk(raw) {
    const names=String(raw||'').split(/\r?\n/).map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean);
    const seen=new Set(clubNow().entries.map(e=>normaliseName(e.name)));
    const accepted=[]; const duplicates=[];
    for(const name of names) {
      const key=normaliseName(name);
      if(seen.has(key)) duplicates.push(name);
      else { seen.add(key); accepted.push(name); }
    }
    accepted.forEach(name=>{
      const added={id:makeId(),name,fighter:null,color:1,out:false};
      clubNow().entries.push(added);
      if(retainedWheelEntries) retainedWheelEntries.push({...added});
    });
    bulkText=''; bulkOpen=true;
    if(duplicates.length) leftError=`Added ${accepted.length} unique name${accepted.length===1?'':'s'}. Skipped duplicate${duplicates.length===1?'':'s'}: ${duplicates.slice(0,6).join(', ')}${duplicates.length>6?'…':''}. Add initials or another identifier for those players.`;

  function animateHighlights(pool, chosen, baseDuration) {
    return new Promise(resolve=>{
      const tracks=chosen.map((entry,i)=>{
        const targetIndex=pool.findIndex(p=>p.id===entry.id);
        const startIndex=Math.floor(Math.random()*pool.length);
        const distance=(targetIndex-startIndex+pool.length)%pool.length;
        const loops=3+Math.floor(Math.random()*3);
        const steps=loops*pool.length+distance;
        const spread=chosen.length===1 ? 1 : (.76 + .24*(i/(chosen.length-1)));
        return {entry,targetIndex,startIndex,steps,duration:baseDuration*spread};
      });
      const startedAt=performance.now();
      isAnimating=true;
      function frame(now) {
        const highlights=new Set();
        let finished=0;
        for(const track of tracks) {
          const progress=Math.max(0,Math.min(1,(now-startedAt)/track.duration));
          const eased=1-Math.pow(1-progress,3);
          const index=progress>=1 ? track.targetIndex : (track.startIndex+Math.floor(eased*track.steps))%pool.length;
          highlights.add(pool[index].id);
          if(progress>=1) finished++;
        }
        activeHighlightIds=highlights;
        drawWheel();
        if(finished===tracks.length) {
          activeHighlightIds=new Set(chosen.map(e=>e.id));
          isAnimating=false;
          drawWheel();
          resolve();
        } else requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }
  function shuffled(items) {
    const copy=items.slice();
    for(let i=copy.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }
  async function spinBatch(requested) {

    const chosen=shuffled(pool).slice(0,count);
    retainedWheelEntries=pool.map(entry=>({...entry}));
    isSpinning=true;
    activeHighlightIds=new Set();
    const c=clubNow();
    const group={id:makeId(),number:c.nextBatch++,requestedCount:requested,createdAt:Date.now(),entries:[]};
    c.history.push(group);
    saveData(); renderApp();

    await animateHighlights(pool,chosen,Number(data.settings.spinSpeed)||2100);

    const pickedAt=Date.now();
    group.entries=chosen.map(entry=>({id:entry.id,name:entry.name,fighter:entry.fighter||null,color:entry.color||1,selectedAt:pickedAt}));
    if(data.settings.autoRemove) chosen.forEach(entry=>{const live=clubNow().entries.find(e=>e.id===entry.id);if(live)live.out=true;});

    activeHighlightIds=new Set(chosen.map(e=>e.id));

    }

  app.addEventListener('submit', e=>{
    const form=e.target.closest('form[data-form]'); if(!form)return;
    e.preventDefault(); const type=form.dataset.form; const fd=new FormData(form);
    if(type==='add-person') { pendingName=String(fd.get('name')||''); doAddPerson(pendingName); }
    else if(type==='bulk-import') { bulkText=String(fd.get('names')||''); addBulk(bulkText); }
    else if(type==='new-club') {
      const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');
      if(!name){modal.error='Enter a name for this club list.';renderApp();return;}
      if(data.clubs.some(c=>normaliseName(c.name)===normaliseName(name))){modal.error='A saved list with that name already exists. Choose a different name.';modal.name=name;renderApp();return;}
      const c=createClub(name);data.clubs.push(c);data.currentClubId=c.id;retainedWheelEntries=null;activeHighlightIds.clear();modal=null;saveData();renderApp();showToast(`${name} created and saved.`);
    }
    else if(type==='edit-entry') {
      const name=String(fd.get('name')||'').trim().replace(/\s+/g,' '); const e1=clubNow().entries.find(x=>x.id===modal.id);
      if(!name){modal.error='Enter a display name.';modal.name=name;renderApp();return;}
      if(duplicateFor(name,modal.id)){modal.error=`“${name}” is already on this list. Add a surname initial or another unique identifier.`;modal.name=name;renderApp();return;}
      if(e1){e1.name=name;e1.fighter=modal.fighter||null;e1.color=Number(modal.color)||1;}
      if(retainedWheelEntries && e1){const snapshotEntry=retainedWheelEntries.find(entry=>entry.id===e1.id);if(snapshotEntry)Object.assign(snapshotEntry,{name:e1.name,fighter:e1.fighter,color:e1.color,out:e1.out});}
      modal=null;saveData();renderApp();showToast('Participant updated.');
    }
    else if(type==='rename-club') {
      const name=String(fd.get('name')||'').trim().replace(/\s+/g,' ');
      if(!name){modal.error='Enter a name for this list.';renderApp();return;}
      if(data.clubs.some(c=>c.id!==data.currentClubId&&normaliseName(c.name)===normaliseName(name))){modal.error='Another saved list already uses that name.';renderApp();return;}
      clubNow().name=name;modal=null;saveData();renderApp();showToast('Club list renamed.');
    }
  });
  app.addEventListener('change', e=>{
    const target=e.target;
    if(target.id==='clubSelect') { if(isSpinning)return; data.currentClubId=target.value; retainedWheelEntries=null; activeHighlightIds.clear(); batchExcluded.clear(); leftError='';pendingName='';bulkText='';bulkOpen=false;saveData();renderApp(); }
    if(target.dataset.setting) {
      const key=target.dataset.setting;
      if(key==='autoRemove') data.settings.autoRemove=target.checked;
      if(key==='defaultCount') data.settings.defaultCount=Number(target.value)||1;
      if(key==='spinSpeed') data.settings.spinSpeed=Number(target.value)||2100;
      if(key==='displayMode') data.settings.displayMode=target.value==='grid'?'grid':'wheel';
      if(key==='nameLayout') data.settings.nameLayout=target.value==='radial'?'radial':'tangential';
      if(key==='nameOrientation') data.settings.nameOrientation=target.value==='clockwise'?'clockwise':'upright';
      saveData();renderApp();
    }
  });
  app.addEventListener('input', e=>{
    if(e.target.id==='fighterSearch' && modal?.type==='fighter-picker') {
      const pos=e.target.selectionStart; modal.search=e.target.value;
      const body=document.querySelector('.modal-body');
      // Refresh only the fighter grid so typing does not close the search field.
      const grid=body?.querySelector('.fighter-grid');
      if(grid) {
        const query=modal.search.toLocaleLowerCase();
        const list=FIGHTERS.filter(f=>f.name.toLocaleLowerCase().includes(query));
        grid.innerHTML=list.map(f=>`<button class="fighter-card" data-action="select-fighter" data-slug="${esc(f.slug)}">${fighterThumb(f,1)}<span>${esc(f.name)}</span></button>`).join('')||'<div class="empty-list">No fighters match that search.</div>';
      }
    }
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'&&modal&&!isSpinning){modal=null;renderApp();} });
  renderApp();
})();
</script>
</body>
</html>
